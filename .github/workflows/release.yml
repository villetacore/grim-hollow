name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/build.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/releases
      - name: Validate release and checksums
        run: |
          python tools/release.py check --tag "$GITHUB_REF_NAME"
          python tools/release.py checksums
          cd dist/releases
          sha256sum -c SHA256SUMS.txt
      - name: Build and publish server image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=$(cat VERSION | tr -d '\r\n')
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -f infra/docker/server/Production.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$version" \
            -t "$image:$version" -t "$image:sha-$GITHUB_SHA" .
          docker push "$image:$version"
          docker push "$image:sha-$GITHUB_SHA"
          docker inspect --format='{{index .RepoDigests 0}}' "$image:$version" > dist/releases/server-image.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Grim Hollow $GITHUB_REF_NAME" --notes-file CHANGELOG.md "${flags[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/releases/*.zip dist/releases/*.tar.gz dist/releases/SHA256SUMS.txt dist/releases/server-image.txt --clobber
