name: grim-hollow-production
x-app: &app
  image: ${GAME_IMAGE:-grim-hollow-server:production}
  build:
    context: ../..
    dockerfile: infra/docker/server/Production.Dockerfile
  environment: &env
    APP_ENV: production
    APP_DEBUG: 'false'
    APP_KEY: ${APP_KEY:?Set APP_KEY}
    APP_URL: https://${GAME_DOMAIN:?Set GAME_DOMAIN}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_DATABASE: grim_hollow
    DB_USERNAME: grim
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    CACHE_STORE: database
    SESSION_DRIVER: array
    LOG_CHANNEL: stderr
  init: true
  restart: unless-stopped
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: grim_hollow
      MYSQL_USER: grim
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD}
    volumes: [mysql-data:/var/lib/mysql]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  migrate:
    <<: *app
    restart: 'no'
    command: [php, artisan, migrate, --force]
    depends_on:
      mysql: {condition: service_healthy}
  api:
    <<: *app
    depends_on:
      migrate: {condition: service_completed_successfully}
  world:
    <<: *app
    command: [php, world.php, start]
    depends_on:
      migrate: {condition: service_completed_successfully}
  web:
    image: nginx:1.28-alpine
    volumes: [../nginx/game.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [api]
    restart: unless-stopped
  edge:
    image: caddy:2-alpine
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN}
    volumes: [../caddy/Caddyfile:/etc/caddy/Caddyfile:ro, caddy-data:/data, caddy-config:/config]
    ports: ['80:80', '443:443', '443:443/udp']
    depends_on: [web, world]
    restart: unless-stopped
volumes:
  mysql-data:
  caddy-data:
  caddy-config:
